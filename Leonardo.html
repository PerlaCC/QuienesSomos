<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil - Leonardo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 30px;
      text-align: center;
      max-width: 320px;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }
    h1 {
      margin: 10px 0 5px;
      font-size: 22px;
    }
    h2 {
      font-size: 16px;
      color: #555;
      margin-top: 25px;
      margin-bottom: 8px;
      text-align: left;
    }
    ul {
      text-align: left;
      margin: 0;
      padding-left: 20px;
    }
    a.back {
      display: inline-block;
      margin-top: 25px;
      font-size: 14px;
      color: #2a6ebb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="Leonardo.jpeg" alt="Avatar de Leonardo">
    <h1>Leonardo</h1>

    <h2>Intereses profesionales</h2>
    <ul>
      <li>Desarrollo web frontend</li>
      <li>Diseño de interfaces (UI/UX)</li>
      <li>Aprendizaje de nuevos frameworks</li>
    </ul>

    <h2>Pasatiempos</h2>
    <ul>
      <li>Fotografía</li>
      <li>Inmunología</li>
      <li>Hacer ejercicio</li>
    </ul>

    <a class="back" href="index.html">&larr; Volver al inicio</a>
  </div>
</body>
</html>
